<!DOCTYPE html>
<html>

<head>

    <title>IR Sensor Monitoring Dashboard</title>

    <meta http-equiv="refresh" content="2">

    <style>

        body{
            background:#f4f4f4;
            font-family:Arial;
            text-align:center;
        }

        .container{

            width:500px;

            margin:auto;

            margin-top:60px;

            background:white;

            border-radius:15px;

            padding:30px;

            box-shadow:0px 0px 20px gray;

        }

        h1{

            color:#333;

        }

        .green{

            color:green;

            font-size:40px;

        }

        .red{

            color:red;

            font-size:40px;

        }

        .time{

            font-size:22px;

            color:#444;

        }

    </style>

</head>

<body>

<div class="container">

<h1>IR Sensor Monitoring Dashboard</h1>

{% if data.status=="Object Detected" %}

<h2 class="green">

🟢 Object Detected

</h2>

{% else %}

<h2 class="red">

🔴 No Object

</h2>

{% endif %}

<hr>

<h3>

Last Updated

</h3>

<p class="time">

{{data.time}}

</p>

</div>

</body>

</html>
